# ===================================================================
# FinSight One-Shot Migration Profile (Plane 2: finsight_migrator)
# ===================================================================

# Disable web environment
spring.main.web-application-type=none

# Hardened Flyway properties
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# Migration Datasource configuration
spring.flyway.url=jdbc:postgresql://${DB_HOST:postgres.finsight.internal}:${DB_PORT:5432}/${DB_NAME:sme_health}?sslmode=${DB_SSL_MODE:verify-full}&sslrootcert=${DB_SSL_ROOT_CERT:/etc/finsight/certs/postgres-ca.crt}
spring.flyway.user=finsight_migrator
spring.flyway.password=${migrator_db_password}

# Spring datasource aligns with Flyway for migration execution
spring.datasource.url=${spring.flyway.url}
spring.datasource.username=finsight_migrator
spring.datasource.password=${migrator_db_password}
