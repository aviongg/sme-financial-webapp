spring.application.name=sme-health-backend

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:sme_health}
spring.datasource.username=${POSTGRES_USER:sme_user}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# Document storage & OCR integration
app.documents.storage-dir=${DOCUMENTS_STORAGE_DIR:./storage/documents}
app.documents.base-url=${DOCUMENTS_BASE_URL:http://localhost:8080}

# WhatsApp Delivery (Feature 8)
app.whatsapp.provider=${WHATSAPP_PROVIDER:mock}
app.whatsapp.portal-url=${WHATSAPP_PORTAL_URL:http://localhost:3000}
app.whatsapp.scheduler.enabled=${WHATSAPP_SCHEDULER_ENABLED:true}
app.whatsapp.scheduler.timezone=${WHATSAPP_SCHEDULER_TIMEZONE:Asia/Karachi}
app.whatsapp.scheduler.cron=${WHATSAPP_SCHEDULER_CRON:0 0 9 * * MON}
app.whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:financial_health_weekly_summary_v1}
app.whatsapp.recovery.stale-threshold-minutes=${WHATSAPP_RECOVERY_STALE_THRESHOLD_MINUTES:15}
app.whatsapp.meta.base-url=${WHATSAPP_META_BASE_URL:https://graph.facebook.com}
app.whatsapp.meta.api-version=${WHATSAPP_META_API_VERSION:v21.0}
app.whatsapp.meta.phone-number-id=${WHATSAPP_META_PHONE_NUMBER_ID:}
app.whatsapp.meta.access-token=${WHATSAPP_META_ACCESS_TOKEN:}
app.whatsapp.meta.timeout-seconds=${WHATSAPP_META_TIMEOUT_SECONDS:15}

# Security, Session & Authentication (Phase S1)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.session.cookie-name=${SESSION_COOKIE_NAME:FINSIGHT_SESSION}
app.security.session.cookie-secure=${SESSION_COOKIE_SECURE:false}
app.security.session.cookie-same-site=${SESSION_COOKIE_SAME_SITE:Lax}

app.security.argon2.salt-length=16
app.security.argon2.hash-length=32
app.security.argon2.parallelism=1
app.security.argon2.memory=65536
app.security.argon2.iterations=3

app.security.internal-service-secret=${INTERNAL_SERVICE_SECRET:}

# Application-Level Encryption (Phase S5)
finsight.crypto.active-key-id=${FINSIGHT_CRYPTO_ACTIVE_KEY_ID:k1}
finsight.crypto.allow-legacy-plaintext=${FINSIGHT_CRYPTO_ALLOW_LEGACY_PLAINTEXT:false}
finsight.crypto.keys.k1=${FINSIGHT_CRYPTO_KEY_K1:}
finsight.crypto.keys.k2=${FINSIGHT_CRYPTO_KEY_K2:}
finsight.crypto.auto-run-migration=${FINSIGHT_CRYPTO_MIGRATION_AUTO_RUN:false}