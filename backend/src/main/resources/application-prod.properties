# ===================================================================
# FinSight Production Profile (Phase S6 Hardened)
# ===================================================================

# Strict ConfigTree secret import from /run/secrets/
# Missing secrets fail closed. No fallback to a single POSTGRES_PASSWORD.
spring.config.import=configtree:/run/secrets/

# Production Datasource (Plane 3: finsight_app, TLS verify-full enforced)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres.finsight.internal}:${DB_PORT:5432}/${DB_NAME:sme_health}?sslmode=verify-full&sslrootcert=${DB_SSL_ROOT_CERT:/etc/finsight/certs/postgres-ca.crt}
spring.datasource.username=finsight_app
spring.datasource.password=${app_db_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Normal runtime strictly disables Flyway
spring.flyway.enabled=false

# Strictly prevent any runtime DDL
spring.jpa.hibernate.ddl-auto=none
spring.session.jdbc.initialize-schema=never
