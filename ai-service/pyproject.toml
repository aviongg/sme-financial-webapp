[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-ocr-service"
version = "0.1.0"
description = "Feature 11: provider-independent OCR drafts for human review"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "google-cloud-vision>=3.10,<4",
  "Pillow>=11,<13",
  "pypdf>=6,<7",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
