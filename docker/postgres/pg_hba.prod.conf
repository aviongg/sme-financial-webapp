# ===================================================================
# FinSight PostgreSQL Production Client Authentication (pg_hba.conf)
# Phase S6 Three-Plane Security Model
# ===================================================================

# 1. Plane 1: Administrative Recovery Access (Local Unix Socket Only)
# finsight_dba is strictly restricted to local container socket
local   all             finsight_dba                            scram-sha-256

# 2. Plane 2: Deployment / Migration Access (Internal Dedicated Subnet Only)
hostssl sme_health      finsight_migrator   172.28.10.0/24      scram-sha-256

# 3. Plane 3: Application Runtime Access (Internal Dedicated Subnet Only)
hostssl sme_health      finsight_app        172.28.10.0/24      scram-sha-256

# 4. Plane 4: Scheduled Encrypted Backup Access (Internal Dedicated Subnet Only)
hostssl sme_health      finsight_backup     172.28.10.0/24      scram-sha-256

# 5. Strict Rejection of Plaintext Network Connections
hostnossl all           all                 all                 reject

# 5. Default Deny: Reject All Other Network Connections
host    all             all                 all                 reject
