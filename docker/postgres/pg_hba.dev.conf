# PostgreSQL Client Authentication Configuration File
# FinSight S6 Hardened Configuration (Development & Local Test Harness)

# Plane 1: Administrative local access only (Unix domain socket)
local   all             finsight_dba                                            scram-sha-256

# Plane 2: Deployment / Migration Access (Internal Dedicated Subnet)
hostssl sme_health      finsight_migrator       172.28.10.0/24                  scram-sha-256

# Plane 3: Application Runtime Access (Internal Dedicated Subnet)
hostssl sme_health      finsight_app            172.28.10.0/24                  scram-sha-256

# Development / Test Harness Access (Host Gateway & Loopback - SSL + SCRAM required)
hostssl sme_health      finsight_migrator       127.0.0.1/32                    scram-sha-256
hostssl sme_health      finsight_app            127.0.0.1/32                    scram-sha-256
hostssl sme_health      finsight_migrator       172.16.0.0/12                   scram-sha-256
hostssl sme_health      finsight_app            172.16.0.0/12                   scram-sha-256

# Strict Rejection: All unencrypted network connections
hostnossl all           all                     all                             reject

# Default Deny: All other network connections
host    all             all                     all                             reject
