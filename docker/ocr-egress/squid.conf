# CONNECT only, exact Google Vision/token destinations, TLS remains end-to-end.
http_port 3128
acl ai_clients src 172.28.40.0/24
acl connect_method method CONNECT
acl tls_port port 443
acl provider_hosts dstdomain vision.googleapis.com oauth2.googleapis.com
http_access allow ai_clients connect_method tls_port provider_hosts
http_access deny all
cache deny all
access_log none
cache_log /dev/stderr
cache_store_log none
pid_filename /tmp/squid.pid
shutdown_lifetime 2 seconds
visible_hostname finsight-ocr-egress
