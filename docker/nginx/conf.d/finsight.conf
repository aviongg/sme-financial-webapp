# Upstream definitions
upstream backend_service {
    server backend-runtime:8080;
    keepalive 32;
}

upstream frontend_service {
    server frontend-runtime:3000;
    keepalive 32;
}

# S8-20 Catch-all server to drop requests with unexpected Host headers (Host Header Hardening)
server {
    listen 8080 default_server;
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}

# S8-4 HTTP port 8080: Permanent redirect to HTTPS
server {
    listen 8080;
    server_name ${APP_DOMAIN:-localhost};

    # S8-25 Public Edge Health Check
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# S8-4 Public HTTPS Server (Edge Termination)
server {
    listen 8443 ssl;
    server_name ${APP_DOMAIN:-localhost};

    # TLS Certificates (External secrets mounted in container)
    ssl_certificate /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;

    # S8-4 Protocols: TLS 1.2 and 1.3 only (TLS 1.0 and 1.1 disabled)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # S8-5 HSTS (1 year max-age, no preload, no includeSubDomains)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # S8-12 Security Response Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # S8-13 Content Security Policy (No unsafe-eval on scripts)
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline';" always;

    # S8-15 Request Method Hardening: Reject TRACE, TRACK, CONNECT
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$ ) {
        return 405;
    }

    # S8-16 Default request body limit (1MB for general JSON APIs)
    client_max_body_size 1m;

    # S8-25 Public Edge Health Check
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # S8-18 Layer A Rate Limiting for Auth surfaces
    location ~ ^/api/auth/(login|register|password-reset/.*|mfa/.*)$ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        # S8-7 Secure Proxy Headers (Overwriting client-supplied identity)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # S8-16 & S8-18 Document upload route: 10MB limit & upload rate limit
    location /api/documents/upload {
        limit_req zone=upload_limit burst=2 nodelay;
        client_max_body_size 10m;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # S8-6 Same-Origin Public Routing: /api/ -> Spring Boot
    location /api/ {
        limit_req zone=api_burst burst=50 nodelay;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # S8-6 Same-Origin Public Routing: / -> Next.js Frontend
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
