worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # S8-26 Secure Logging: Strip query parameters and sensitive headers
    log_format secure_combined '$remote_addr - $remote_user [$time_local] '
                                '"$request_method $uri $server_protocol" '
                                '$status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time req_id=$request_id';

    access_log /var/log/nginx/access.log secure_combined;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # S8-17 Proxy Timeouts & Slow Client Hardening
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;

    # S8-18 Layer A Rate Limiting Zones (IP-based)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_burst:10m rate=30r/s;
    limit_req_status 429;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
