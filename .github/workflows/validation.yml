name: Release validation
on:
  pull_request:
  push:
    branches: [main, dev/fatima, dev/suleman, 'codex/production-closure-infra-tests']
  workflow_dispatch:
    inputs:
      full_browser:
        description: Run the full offline product browser acceptance in addition to smoke
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MAVEN_OPTS: -Xmx512m -XX:+UseSerialGC
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_DATA_MODE: live
jobs:
  backend-unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x backend/mvnw
      - run: ./mvnw -B test
        working-directory: backend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-unit
          path: backend/target/surefire-reports/
          retention-days: 14
  postgres:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: chmod +x backend/mvnw
      - run: python scripts/release/postgres_gate.py --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: postgres-${{ matrix.shard }}
          path: backend/target/failsafe-reports/
          retention-days: 14
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm build:release
        working-directory: frontend
  browser-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: chmod +x backend/mvnw
      - run: ./mvnw -B test-compile dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=target/test-classpath.txt
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm build:release
        working-directory: frontend
      - run: pnpm test:browser:smoke
        working-directory: frontend
      - run: pnpm test:browser:product
        if: github.event_name == 'workflow_dispatch' && inputs.full_browser
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-evidence
          path: frontend/test-artifacts/
          retention-days: 14
  ocr-and-operations:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements-tested.txt
            scripts/release/requirements.txt
      - run: python -m pip install -c ai-service/requirements-tested.txt -e './ai-service[test]' -r scripts/release/requirements.txt
      - run: python -m pytest -q
        working-directory: ai-service
      - run: python -m unittest discover -s scripts/backup -p 'test_*.py' -v
      - run: python -m unittest discover -s scripts -p test_production_configuration.py -v
      - run: python -m unittest discover -s scripts/release -p 'test_*.py' -v
  release-gate:
    if: always()
    needs: [backend-unit, postgres, frontend, browser-smoke, ocr-and-operations]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert all(j['result'] == 'success' for j in jobs.values()), jobs
          PY
